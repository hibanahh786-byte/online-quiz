<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Quiz - Online Quiz System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Design System -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Dynamic Navigation Bar -->
  <div id="main-navbar-container"></div>

  <!-- Main Quiz Container -->
  <div class="container py-4">
    
    <!-- Top Quiz Bar -->
    <div class="quiz-header">
      <div class="d-flex align-items-center gap-3">
        <a href="/categories.html" class="btn btn-outline-secondary btn-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 42px; height: 42px; padding: 0;" title="Back to Categories">
          <i class="bi bi-arrow-left fs-5"></i>
        </a>
        <div>
          <div class="d-flex align-items-center gap-2 mb-1">
            <span class="badge badge-primary" id="quizCategoryBadge">Live Quiz</span>
            <span id="quizDifficultyBadge"></span>
          </div>
          <h4 class="fw-bold mb-0 text-white" id="quizCategoryTitle">Online Assessment</h4>
        </div>
      </div>

      <!-- Live Countdown Timer -->
      <div class="d-flex align-items-center gap-3">
        <div class="timer-box" id="timerBox">
          <i class="bi bi-stopwatch"></i>
          <span id="timerDisplay">00:00</span>
        </div>
        <button class="btn btn-danger btn-sm px-3" id="topSubmitBtn">
          <i class="bi bi-send-check"></i> Submit Quiz
        </button>
      </div>
    </div>

    <!-- Loading State -->
    <div id="quizLoader" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="text-muted mt-3">Preparing test environment and questions...</p>
    </div>

    <!-- Active Quiz Layout -->
    <div class="row g-4 d-none" id="quizContentRow">
      <!-- Main Question Area -->
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm p-4 mb-4">
          <!-- Question Header & Marks -->
          <div class="d-flex justify-content-between align-items-center pb-3 border-bottom mb-4">
            <span class="fw-bold text-primary" id="questionNumberIndicator">Question 1 of 10</span>
            <span class="badge bg-light text-dark border" id="questionMarksBadge">1 Mark</span>
          </div>

          <!-- Question Text -->
          <h5 class="fw-bold text-dark mb-4" id="questionText">Loading question...</h5>

          <!-- 4 Multiple Choice Options -->
          <div id="optionsContainer">
            <!-- Rendered dynamically -->
          </div>

          <!-- Bottom Nav Controls -->
          <div class="d-flex justify-content-between align-items-center pt-4 border-top mt-4">
            <button class="btn btn-outline-secondary" id="prevQuestionBtn">
              <i class="bi bi-chevron-left"></i> Previous
            </button>
            <button class="btn btn-outline-warning btn-sm" id="clearSelectionBtn">
              <i class="bi bi-x-circle"></i> Clear Selection
            </button>
            <button class="btn btn-primary" id="nextQuestionBtn">
              Next <i class="bi bi-chevron-right"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Question Palette & Summary Sidebar -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm question-palette-card p-3">
          <div class="card-header bg-white border-0 px-2 pt-2 pb-3">
            <h6 class="fw-bold text-dark mb-0"><i class="bi bi-grid-3x3-gap-fill text-primary me-2"></i>Question Palette</h6>
          </div>
          <div class="card-body p-2">
            <!-- Palette Summary Counter -->
            <div class="d-flex justify-content-between align-items-center bg-light p-2 rounded-3 mb-3 small">
              <div>
                <span class="badge bg-success me-1" id="answeredCountBadge">0</span>
                <span class="text-muted">Answered</span>
              </div>
              <div>
                <span class="badge bg-secondary me-1" id="unansweredCountBadge">0</span>
                <span class="text-muted">Unanswered</span>
              </div>
            </div>

            <!-- Palette Grid -->
            <div class="palette-grid mb-4" id="paletteGrid">
              <!-- Rendered dynamically -->
            </div>

            <!-- Submit Final Button -->
            <button class="btn btn-success w-100 py-2 fw-bold" id="finalSubmitBtn">
              <i class="bi bi-check2-circle me-1"></i> Submit & Finish Test
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Submission Spinner Overlay -->
  <div class="modal fade" id="submittingModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content border-0 shadow-lg text-center p-4">
        <div class="spinner-border text-primary mx-auto mb-3" style="width: 3rem; height: 3rem;"></div>
        <h6 class="fw-bold mb-1">Evaluating Answers...</h6>
        <p class="text-muted small mb-0">Computing final score & percentage</p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/quiz.js"></script>
</body>
</html>
