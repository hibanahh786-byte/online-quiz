<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Online Quiz System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Design System -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Dynamic Navigation Bar -->
  <div id="main-navbar-container"></div>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-lg p-3 p-md-4" style="border-radius: 20px;">
          <div class="card-body">
            <div class="text-center mb-4">
              <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="bi bi-person-plus-fill"></i>
              </div>
              <h3 class="fw-bold text-dark">Join Online Quiz System</h3>
              <p class="text-muted small">Create your student profile and test your mastery across subjects</p>
            </div>

            <!-- Registration Form -->
            <form id="registerForm" novalidate>
              <div class="mb-3">
                <label for="regName" class="form-label">Full Name</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control border-start-0" id="regName" placeholder="e.g. John Doe" required>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="regEmail" class="form-label">Email Address</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0" id="regEmail" placeholder="name@example.com" required>
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="regPhone" class="form-label">Phone Number</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                    <input type="tel" class="form-control border-start-0" id="regPhone" placeholder="+1 (555) 000-0000" required>
                  </div>
                </div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label for="regPassword" class="form-label">Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="regPassword" placeholder="Min 6 characters" required>
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="regConfirmPassword" class="form-label">Confirm Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-check2-circle"></i></span>
                    <input type="password" class="form-control border-start-0" id="regConfirmPassword" placeholder="Repeat password" required>
                  </div>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="registerSubmitBtn">
                <span id="regBtnText">Create Student Account</span>
                <span id="regSpinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
              </button>
            </form>

            <div class="text-center text-muted small mt-2">
              Already have an account? <a href="/login.html" class="fw-bold text-primary">Log In Here</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
