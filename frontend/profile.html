<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings - Online Quiz System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Design System -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Dynamic Navigation Bar -->
  <div id="main-navbar-container"></div>

  <!-- Dashboard Container -->
  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="d-flex align-items-center gap-3 px-2 py-3 mb-4 border-bottom">
        <div id="profileSidebarAvatar" class="user-avatar" style="width: 44px; height: 44px; font-size: 1.1rem;">U</div>
        <div class="overflow-hidden">
          <div class="fw-bold text-truncate" id="profileSidebarName">Student</div>
          <span class="badge bg-primary-subtle text-primary small">Student Profile</span>
        </div>
      </div>
      <ul class="sidebar-menu">
        <li>
          <a href="/dashboard.html" class="sidebar-link">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li>
          <a href="/categories.html" class="sidebar-link">
            <i class="bi bi-grid-fill"></i> Quiz Categories
          </a>
        </li>
        <li>
          <a href="/history.html" class="sidebar-link">
            <i class="bi bi-clock-history"></i> Quiz History
          </a>
        </li>
        <li>
          <a href="/leaderboard.html" class="sidebar-link">
            <i class="bi bi-trophy-fill"></i> Leaderboard
          </a>
        </li>
        <li>
          <a href="/profile.html" class="sidebar-link active">
            <i class="bi bi-person-gear"></i> Profile Settings
          </a>
        </li>
        <li class="mt-4 pt-3 border-top">
          <a href="javascript:void(0)" onclick="logout()" class="sidebar-link text-danger">
            <i class="bi bi-box-arrow-right text-danger"></i> Sign Out
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <div class="container-fluid p-0">
        
        <!-- Header -->
        <div class="mb-4">
          <h2 class="fw-bold mb-1">My Account & Profile</h2>
          <p class="text-muted small mb-0">Manage your contact information, security credentials, and avatar.</p>
        </div>

        <div class="row g-4">
          <!-- Profile Details Form -->
          <div class="col-lg-7">
            <div class="card border-0 shadow-sm p-4">
              <h5 class="fw-bold text-dark mb-4"><i class="bi bi-person-lines-fill text-primary me-2"></i>Personal Information</h5>
              
              <form id="profileDetailsForm" novalidate>
                <!-- Avatar Upload Row -->
                <div class="d-flex align-items-center gap-4 mb-4 pb-3 border-bottom">
                  <div id="profilePicturePreview" class="user-avatar" style="width: 72px; height: 72px; font-size: 2rem;">U</div>
                  <div>
                    <label for="profileImageInput" class="btn btn-outline-primary btn-sm mb-1">
                      <i class="bi bi-camera me-1"></i> Upload New Photo
                    </label>
                    <input type="file" id="profileImageInput" class="d-none" accept="image/*">
                    <div class="text-muted small" style="font-size: 0.75rem;">JPG, PNG, or WEBP up to 5MB.</div>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="profName" class="form-label">Full Name</label>
                  <input type="text" class="form-control" id="profName" required>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label for="profEmail" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="profEmail" required>
                  </div>
                  <div class="col-md-6">
                    <label for="profPhone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="profPhone" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label text-muted">Account Role</label>
                  <input type="text" class="form-control bg-light" id="profRole" disabled>
                </div>

                <button type="submit" class="btn btn-primary" id="saveProfileBtn">
                  <i class="bi bi-check2 me-1"></i> Save Profile Changes
                </button>
              </form>
            </div>
          </div>

          <!-- Change Password Form -->
          <div class="col-lg-5">
            <div class="card border-0 shadow-sm p-4">
              <h5 class="fw-bold text-dark mb-4"><i class="bi bi-shield-lock-fill text-primary me-2"></i>Change Password</h5>

              <form id="changePasswordForm" novalidate>
                <div class="mb-3">
                  <label for="currentPassword" class="form-label">Current Password</label>
                  <input type="password" class="form-control" id="currentPassword" required>
                </div>

                <div class="mb-3">
                  <label for="newPassword" class="form-label">New Password</label>
                  <input type="password" class="form-control" id="newPassword" placeholder="Min 6 characters" required>
                </div>

                <div class="mb-4">
                  <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                  <input type="password" class="form-control" id="confirmNewPassword" placeholder="Repeat new password" required>
                </div>

                <button type="submit" class="btn btn-outline-primary w-100" id="changePasswordBtn">
                  <i class="bi bi-key me-1"></i> Update Password
                </button>
              </form>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
