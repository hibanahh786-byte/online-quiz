<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Online Quiz System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Design System -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Dynamic Navigation Bar -->
  <div id="main-navbar-container"></div>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow-lg p-3 p-md-4" style="border-radius: 20px;">
          <div class="card-body">
            <div class="text-center mb-4">
              <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="bi bi-shield-lock-fill"></i>
              </div>
              <h3 class="fw-bold text-dark">Welcome Back</h3>
              <p class="text-muted small">Enter your credentials to access your quiz dashboard</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="name@example.com" required>
                </div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <label for="loginPassword" class="form-label mb-0">Password</label>
                  <a href="javascript:void(0)" class="text-primary small" onclick="showToast('To reset your password, please contact the administrator at support@quizsystem.com', 'info')">Forgot Password?</a>
                </div>
                <div class="input-group mt-1">
                  <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                  <input type="password" class="form-control border-start-0 border-end-0" id="loginPassword" placeholder="Enter your password" required>
                  <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePasswordBtn">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe">
                  <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="loginSubmitBtn">
                <span id="loginBtnText">Sign In</span>
                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
              </button>
            </form>

            <div class="text-center text-muted small mt-2">
              Don't have an account yet? <a href="/register.html" class="fw-bold text-primary">Register Here</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
