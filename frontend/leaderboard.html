<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - Online Quiz System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Design System -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Dynamic Navigation Bar -->
  <div id="main-navbar-container"></div>

  <!-- Main Content -->
  <div class="container py-5">
    
    <!-- Header -->
    <div class="text-center max-w-700 mx-auto mb-4">
      <span class="badge badge-primary px-3 py-2 mb-2">
        <i class="bi bi-trophy-fill text-warning me-1"></i> TOP PERFORMERS
      </span>
      <h1 class="h2 fw-bold text-dark">Global Academic Leaderboard</h1>
      <p class="text-muted">
        Compete with peers, achieve highest accuracy across quizzes, and earn your place on the academic podium.
      </p>

      <!-- Timeframe Filter Buttons -->
      <div class="btn-group shadow-sm mt-3" role="group">
        <button type="button" class="btn btn-outline-primary active" id="tabOverall" onclick="switchFilter('overall')">
          <i class="bi bi-globe me-1"></i> All-Time
        </button>
        <button type="button" class="btn btn-outline-primary" id="tabWeekly" onclick="switchFilter('weekly')">
          <i class="bi bi-calendar-week me-1"></i> This Week
        </button>
        <button type="button" class="btn btn-outline-primary" id="tabMonthly" onclick="switchFilter('monthly')">
          <i class="bi bi-calendar-month me-1"></i> This Month
        </button>
      </div>
    </div>

    <!-- Top 3 Podium Cards -->
    <div class="podium-container" id="podiumRow">
      <!-- Rendered dynamically -->
    </div>

    <!-- Full Ranking Table Card -->
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <h5 class="fw-bold mb-0 text-dark">
          <i class="bi bi-list-ol text-primary me-2"></i>Full Standings
        </h5>
        <span class="text-muted small" id="leaderboardCountBadge">0 Participants</span>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th style="width: 80px;" class="text-center">Rank</th>
                <th>Learner</th>
                <th class="text-center">Quizzes Taken</th>
                <th class="text-center">Total Score</th>
                <th class="text-center">Average Accuracy</th>
                <th class="text-center">Best Score</th>
              </tr>
            </thead>
            <tbody id="leaderboardTbody">
              <tr>
                <td colspan="6" class="text-center py-5 text-muted">
                  <div class="spinner-border spinner-border-sm text-primary me-2"></div> Loading rankings...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/leaderboard.js"></script>
</body>
</html>
